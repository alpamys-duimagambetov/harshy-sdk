name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools build-tools;36.0.0 platforms;android-36

      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test

  native-ios:
    # Pinned so the job does not change when `macos-latest` or the image's default Xcode moves.
    # Bump the runner label and the Xcode path together. Installed versions are listed in
    # https://github.com/actions/runner-images/blob/main/images/macos/macos-26-arm64-Readme.md
    runs-on: macos-26
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      # Fails fast, and records the toolchain in the log, if the pinned Xcode is not on the image.
      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version
      - name: HarshyMath Swift tests
        run: swift test --package-path packages/native/HarshyMath
      # HarshyEngine and HarshyClient import UIKit, so HarshyMath cannot compile them. Build the full
      # package for iOS so a break in the CoreLocation / CoreMotion client fails the PR.
      - name: Build Harshy for iOS Simulator
        working-directory: packages/native
        run: xcodebuild -scheme Harshy -destination 'generic/platform=iOS Simulator' -quiet CODE_SIGNING_ALLOWED=NO build
